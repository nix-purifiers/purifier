# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux, aarch64-linux and aarch64-darwin: the flake's
# checks (the tests of the library that need no build, the builds that
# fetch a real file, git checkout and archive and lay them out as a tree,
# and the formatting).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - name: Verify real implementation pin lifecycle
        run: |
          pinning_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix run ".#checks.$pinning_system.implementation-lifecycle-driver" -- \
            --output "$RUNNER_TEMP/implementation-lifecycle.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-lifecycle-${{ matrix.runner }}
          path: ${{ runner.temp }}/implementation-lifecycle.json
      - run: python3 tests/project-input-sources.py
      - run: python3 -B tests/jvm-sdk-sources.py --output sdk-source-proof.json
      - run: python3 -B tests/jvm-sdk-replay.py --output sdk-replay-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-sdk-source-proof-${{ matrix.runner }}
          path: |
            sdk-source-proof.json
            sdk-replay-proof.json
